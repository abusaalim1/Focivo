name: TEMP v130-admin tests (DELETE AFTER GREEN)

# Temporary: compile + unit tests + Roborazzi screenshots for the v1.3.0
# follow-up (device-admin uninstall protection). Push-triggered so it runs on
# the feature branch without touching main. DELETE THIS FILE after green.
on:
  push:
    branches: [feat/v130-squads]
    paths:
      - '.github/workflows/v130-admin-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests + admin screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept All Licenses
        run: |
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          sudo chmod -R u+rwX "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd01e217609cb32e753ac077a977\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Unit tests (gate truth table)
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.UninstallProtectionGateTest" --rerun-tasks --no-configuration-cache

      - name: Screenshot tests (admin sheets)
        run: ./gradlew :app:recordRoborazziDebug --tests "com.example.screenshots.StrictAdminSheetScreenshotsTest" --rerun-tasks --no-configuration-cache

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-admin-screenshots
          path: app/src/test/screenshots/v130-admin/
