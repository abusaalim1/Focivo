name: V123 Guest Escape Unit Tests

# TEMPORARY verification workflow for the v1.2.3 guest-escape fix (run manually,
# then delete). Compiles the app and runs the GuestSessionEscapeTest regression
# tests. Nothing touches main. Do NOT modify build-release-apk.yml.

on:
  workflow_dispatch:

jobs:
  guest-escape-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run guest-escape regression tests
        run: gradle :app:testDebugUnitTest --tests "com.example.GuestSessionEscapeTest" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump test results
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(tc.get('classname'),'::',tc.get('name'),'->','PASS' if not (list(tc.iter('failure'))+list(tc.iter('error'))) else 'FAIL') for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-com.example.GuestSessionEscapeTest.xml') for tc in ET.parse(f).getroot().iter('testcase')];[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"
