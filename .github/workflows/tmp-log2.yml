name: TMP Log2 (delete after verify)

on:
  push:
    branches: [feat/v123-splash]

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Record with log capture
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v123.*" --rerun-tasks --no-configuration-cache --stacktrace > /tmp/r2.log 2>&1; echo "EXIT=$?" >> /tmp/r2.log; grep -E "^e: |FAILED|EXIT=" /tmp/r2.log | head -30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-r2-log
          path: /tmp/r2.log
          if-no-files-found: warn
