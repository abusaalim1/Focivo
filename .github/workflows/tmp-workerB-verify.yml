name: TMP WorkerB Verify (delete after verify)

# Temporary verification workflow for the v1.3.0 worker-B round (items 4+5):
# compiles the app and runs the affected unit tests. Triggered manually on
# feat/v130-squads, then deleted. Nothing touches main. No publish.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run worker-B unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.WeekBarFractionsTest" --tests "com.example.ContentLockTest" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump test results
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(tc.get('classname'),'::',tc.get('name'),'->','PASS' if not (list(tc.iter('failure'))+list(tc.iter('error'))) else 'FAIL') for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-com.example.WeekBarFractionsTest.xml')+glob.glob('app/build/test-results/testDebugUnitTest/TEST-com.example.ContentLockTest.xml') for tc in ET.parse(f).getroot().iter('testcase')];[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"
