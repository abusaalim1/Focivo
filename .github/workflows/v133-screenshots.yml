name: v133 Item Screenshots

# v1.3.3 round (items 7 + 9): runs the Robolectric/Roborazzi screenshot tests
# for the Sunday Recap restyle and the caption contrast sweep, plus the
# caption-contrast unit test, and uploads the PNGs as an artifact for owner
# review. Dispatch manually against the work branch:
#   gh-api dispatch abusaalim1/Focivo v133-screenshots.yml --ref fix/v133-round
#
# Note: this repo has no gradle wrapper committed, so we provision Gradle
# via gradle/actions/setup-gradle like the debug build workflow does.

on:
  push:
    branches: [fix/v133-round]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Quarantine compile-blocking test files (other workers' WIP)
        # The shared branch's test source set currently fails to compile
        # because of OTHER items' test files (not items 7/9). Quarantining
        # them ephemerally (CI workspace only — the repo is untouched) so
        # the v133 item tests can compile and run. Owning workers must fix:
        #  - MemberProfileStatsTest.kt: illegal characters in a test name
        #  - TimerRemainingTimeTest.kt: unresolved setCurrentTimeMillis /
        #    setElapsedRealtime helpers
        #  - PermissionStatesTest.kt: unresolved strOpToOp
        # (V133UsageBudgetScreenshotsTest was removed from this list 2026-10-18:
        # the missing onRoot import is fixed and it compiles in the green
        # build-apk test-compile, so it now runs its Roborazzi screenshots.)        # (ITEM 5's GuardToggleWiringTest / GuardClusterScreenshotsTest were
        # removed from this list 2026-10-18: they compile again after the
        # reflection-helper fix, proven by the green build-apk test-compile.)
        run: |
          mkdir -p /tmp/quarantined-tests
          for f in \
            app/src/test/java/com/example/MemberProfileStatsTest.kt \
            app/src/test/java/com/example/TimerRemainingTimeTest.kt \
            app/src/test/java/com/example/util/PermissionStatesTest.kt \
          ; do
            if [ -f "$f" ]; then echo "quarantining $f"; mv "$f" /tmp/quarantined-tests/; fi
          done

      - name: Run caption-contrast unit test
        run: gradle :app:testDebugUnitTest --tests "com.example.BackdropCaptionContrastTest" --stacktrace --no-configuration-cache

      - name: Run v133 screenshot tests (record mode)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v133.*" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Locate generated PNGs
        if: always()
        run: |
          echo "=== test screenshot dirs ==="
          find app/src/test/screenshots/v133 -type f 2>/dev/null | sort

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v133-screenshots
          path: |
            app/src/test/screenshots/v133/
          if-no-files-found: error
