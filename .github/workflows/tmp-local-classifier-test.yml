name: TMP Local Classifier Test (delete after verify)

# TEMPORARY verification workflow for Task 6 (on-device title classifier).
# Runs ONLY com.example.LocalTitleClassifierTest. Delete this file once green.
# Trigger: push to feat/v123-splash (auto-runs alongside the screenshots
# workflow) or manual dispatch. Nothing touches main.

on:
  push:
    branches: [feat/v123-splash]
  workflow_dispatch:

jobs:
  classifier-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run LocalTitleClassifierTest
        run: gradle :app:testDebugUnitTest --tests "com.example.LocalTitleClassifierTest" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump test results
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(tc.get('classname'),'::',tc.get('name'),'->','PASS' if not (list(tc.iter('failure'))+list(tc.iter('error'))) else 'FAIL') for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-com.example.LocalTitleClassifierTest.xml') for tc in ET.parse(f).getroot().iter('testcase')];[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"
