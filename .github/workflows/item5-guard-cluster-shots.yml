name: item5 Guard Cluster Screenshots (TEMP)

# Temporary workflow for ITEM 5 (v1.3.3 Study-page guard control cluster):
# runs the Robolectric/Roborazzi screenshot tests on fix/v133-round and
# uploads the PNGs as an artifact for visual review. DELETE after the
# review pass — it is not part of the shipped CI.

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run item5 screenshot tests (record mode)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.guardcluster.*" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Locate generated PNGs
        if: always()
        run: |
          echo "=== test screenshot dirs ==="
          find app/src/test/screenshots/guard-cluster -type f 2>/dev/null | head -40

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item5-guard-cluster-screenshots
          path: |
            app/src/test/screenshots/guard-cluster/
          if-no-files-found: warn
