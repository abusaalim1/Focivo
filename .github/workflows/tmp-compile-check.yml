name: TMP Record Log Capture (delete after verify)

on:
  push:
    branches: [feat/v123-splash]
  workflow_dispatch:

jobs:
  v123-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run recordRoborazziDebug with full log capture
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v123.*" --rerun-tasks --no-configuration-cache --stacktrace > /tmp/roborazzi.log 2>&1; echo "EXIT=$?" >> /tmp/roborazzi.log; tail -100 /tmp/roborazzi.log

      - name: Dump test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Locate generated PNGs
        if: always()
        run: find app/src/test/screenshots/v123 -type f 2>/dev/null | head -20; find app/src/test/screenshots/v123 -name '*.png' 2>/dev/null | wc -l

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-roborazzi-log
          path: /tmp/roborazzi.log
          if-no-files-found: warn
