name: v11 Polish Screenshots

# v1.1 polish round: runs the Robolectric/Roborazzi screenshot tests on the
# feat/v11-polish branch and uploads the PNGs as an artifact. The owner
# reviews these before approving anything.
#
# Trigger: push to THIS branch only. Nothing ever touches main.
# Note: this repo has no gradle wrapper committed, so we provision Gradle
# via gradle/actions/setup-gradle like the debug build workflow does.

on:
  push:
    branches: [feat/v11-polish]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run screenshot tests (record mode)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v11.*" --stacktrace

      - name: Locate generated PNGs
        if: always()
        run: |
          echo "=== test screenshot dirs ==="
          find app/src/test/screenshots -type f 2>/dev/null | head -60

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-polish-screenshots
          path: |
            app/src/test/screenshots/v11/
          if-no-files-found: error

      - name: Debug APK size (proxy for release size)
        if: always()
        run: |
          gradle :app:assembleDebug --stacktrace
          echo "=== debug APK size ==="
          ls -lh app/build/outputs/apk/debug/*.apk
