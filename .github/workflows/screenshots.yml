name: Round2 Screenshots

# Manual only. Runs the Robolectric/Roborazzi owner-review screenshots on
# the round2/premium-ui-fixes branch and uploads the PNGs as an artifact.
# The owner reviews these before approving any deploy.
#
# Note: this repo has no gradle wrapper committed, so we provision Gradle
# via gradle/actions/setup-gradle like the debug build workflow does.

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout round2 branch
        uses: actions/checkout@v4
        with:
          ref: round2/premium-ui-fixes

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run round2 screenshot tests
        run: gradle :app:testDebugUnitTest --tests "com.example.screenshots.*" --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round2-screenshots
          path: app/src/test/screenshots/round2/
          if-no-files-found: error
