name: v11 Final Screenshots

# v1.1 final-touches round: runs the Robolectric/Roborazzi screenshot tests on the
# feat/v11-final-touches branch and uploads the PNGs as an artifact. The owner
# reviews these before approving anything.
#
# Trigger: push to THIS branch only. Nothing ever touches main.
# Note: this repo has no gradle wrapper committed, so we provision Gradle
# via gradle/actions/setup-gradle like the debug build workflow does.

on:
  push:
    branches: [feat/v11-final-touches]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run screenshot tests (record mode)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v11.*" --stacktrace

      - name: Dump test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Locate generated PNGs
        if: always()
        run: |
          echo "=== test screenshot dirs ==="
          find app/src/test/screenshots -type f 2>/dev/null | head -60

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-final-screenshots
          path: |
            app/src/test/screenshots/v11-final/
          if-no-files-found: error

      - name: Debug APK size (proxy for release size)
        if: always()
        run: |
          gradle :app:assembleDebug --stacktrace
          echo "=== debug APK size ==="
          ls -lh app/build/outputs/apk/debug/*.apk
