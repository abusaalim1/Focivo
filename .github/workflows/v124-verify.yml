name: v124 verify (TEMP - delete before publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: v124 unit + screenshot verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept All Licenses
        run: |
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          sudo chmod -R u+rwX "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd01e217609cb32e753ac077a977\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Ensure environment configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            if grep -q "^GEMINI_API_KEY=" .env; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env
            else
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests (ContentLock + SplashVariant)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: |
          gradle :app:testDebugUnitTest --tests "com.example.ContentLockTest" --tests "com.example.SplashVariantTest" --rerun-tasks --no-configuration-cache --stacktrace 2>&1 | tee verify-tests.log

      - name: Record v124 screenshots
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: |
          gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v124.*" --rerun-tasks --no-configuration-cache --stacktrace 2>&1 | tee verify-shots.log

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v124-screenshots
          path: app/src/test/screenshots/v124/
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v124-verify-logs
          path: |
            verify-tests.log
            verify-shots.log
          if-no-files-found: ignore
