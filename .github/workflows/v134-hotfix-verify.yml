# TEMPORARY (v1.3.4 hotfix verification) — delete before any merge to main.
# Runs the two new/changed Robolectric test classes and records the
# Study-top header screenshots (dark + light), uploading both as artifacts.
name: v134 hotfix verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests + Study header screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept All Licenses
        run: |
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          sudo chmod -R u+rwX "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd01e217609cb32e753ac077a977\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6a6b42e9c35fd443795d43c328de3730a6a\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run v1.3.4 unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest \
            --tests "com.example.util.DailyUsagePipelineTest" \
            --tests "com.example.util.AppUpdateNotifyPolicyTest" \
            --no-configuration-cache 2>&1 | tee unit-tests.log

      - name: Record Study header screenshots (dark + light)
        run: |
          set -o pipefail
          gradle :app:recordRoborazziDebug \
            --tests "com.example.screenshots.v133.V133UsageBudgetScreenshotsTest" \
            --rerun-tasks --no-configuration-cache 2>&1 | tee roborazzi.log

      - name: Upload test results and header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v134-verify
          path: |
            app/build/test-results/testDebugUnitTest/
            app/src/test/screenshots/v133/v133_study_header_dark.png
            app/src/test/screenshots/v133/v133_study_header_light.png
            unit-tests.log
            roborazzi.log
