name: v11 Wardrobe Final Screenshots

# fix/v11-wardrobe-final: runs the Roborazzi mascot screenshot tests in RECORD
# mode with --rerun-tasks (so renders are REAL, never cached) and uploads the
# PNGs. Parent eye-verifies these before anything ships.
#
# Trigger: push to THIS branch only + manual dispatch. Nothing touches main.

on:
  push:
    branches: [fix/v11-wardrobe-final]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run mascot screenshot tests (record mode, forced re-render)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.v11.V11NewFeaturesScreenshotsTest" --rerun-tasks --stacktrace

      - name: Dump test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-wardrobe-final-screenshots
          path: |
            app/src/test/screenshots/v11/mascot_screen_dressed.png
            app/src/test/screenshots/v11/mascot_screen_default.png
            app/src/test/screenshots/v11/study_timer_dressed_buddy.png
            app/src/test/screenshots/v11/buddy_mascot_dressed_closeup.png
          if-no-files-found: error

      - name: Debug APK size (proxy for release size)
        if: always()
        run: |
          gradle :app:assembleDebug --stacktrace
          echo "=== debug APK size ==="
          ls -lh app/build/outputs/apk/debug/*.apk
