name: V130 Final Verify

# v1.3.0 FINAL assembly verify (branch feat/v130-squads):
#  1. compileDebugKotlin (fails fast on Kotlin errors)
#  2. FULL unit test suite (:app:testDebugUnitTest)
#  3. V130 screenshot tests in record mode (V130Squads* cards + V130Final*
#     full-screen sweep: Home/squads hub-create-invite-join-detail,
#     session-complete, customize timer, profile + edit profile, Focus)
# Uploads the PNGs as an artifact for eyeball verification.
#
# Trigger: push to THIS branch only + manual dispatch. Nothing touches main.
# Note: this repo has no gradle wrapper committed, so we provision Gradle
# via gradle/actions/setup-gradle like the debug build workflow does.
#
# CRITICAL: --rerun-tasks --no-configuration-cache forces REAL renders.
# Without them the gradle cache can fake-pass in ~20s with zero PNGs.

on:
  push:
    branches: [feat/v130-squads]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile app (fails fast on Kotlin errors)
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Run FULL unit test suite
        run: gradle :app:testDebugUnitTest --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump unit test results
        if: always()
        run: |
          python3 -c "
          import glob, xml.etree.ElementTree as ET
          total = passed = failed = errors = 0
          bad = []
          for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  total += 1
                  fails = list(tc.iter('failure')) + list(tc.iter('error'))
                  if fails:
                      failed += 1
                      bad.append((tc.get('classname'), tc.get('name'), (fails[0].get('message') or '')[:300]))
                  else:
                      passed += 1
          print(f'UNIT TESTS: total={total} passed={passed} failed={failed}')
          for c, n, m in bad: print('FAIL:', c, '::', n, '::', m)
          "

      - name: Run V130 screenshot tests (record mode, forced real renders)
        run: gradle :app:recordRoborazziDebug --tests "com.example.screenshots.V130*" --rerun-tasks --no-configuration-cache --stacktrace

      - name: Dump screenshot test failure stacks
        if: always()
        run: python3 -c "import glob,xml.etree.ElementTree as ET;[print(chr(61)*70,tc.get('classname'),'::',tc.get('name'),'MESSAGE:',(fl.get('message')or '')[:800],'STACK:',(fl.text or '')[:4000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml') for tc in ET.parse(f).getroot().iter('testcase') for fl in list(tc.iter('failure'))+list(tc.iter('error'))]"

      - name: Locate generated PNGs
        if: always()
        run: |
          echo "=== v130-squads PNGs ==="
          find app/src/test/screenshots/v130-squads -name '*.png' 2>/dev/null | wc -l
          echo "=== v130-final PNGs ==="
          find app/src/test/screenshots/v130-final -name '*.png' 2>/dev/null | wc -l
          find app/src/test/screenshots/v130-final -name '*.png' 2>/dev/null | head -40

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-final-screenshots
          path: |
            app/src/test/screenshots/v130-squads/
            app/src/test/screenshots/v130-final/
          if-no-files-found: error
